[pytest]
# 本目录下的测试文件按业务页面命名（login_register.py 等），需显式声明收集规则
python_files =
    login_register.py
    image_edit.py
    image_stitch.py
    my_image.py
    history_record.py

python_classes = Test*
python_functions = test_*

testpaths = .
addopts = -v --tb=short

markers =
    ai: 依赖 AI 出图 / 向量化 / 检索的用例（Python 服务会吃满本机 CPU，建议与其它用例分开跑）


filterwarnings =
    ignore::DeprecationWarning
